spring.application.name=food.recipes
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database=postgresql
spring.jpa.show-sql=true

application.security.jwt.access_token.expiration=${JWT_ACCESS_TOKEN_EXPIRATION}
application.security.jwt.refresh_token.expiration=${JWT_REFRESH_TOKEN_EXPIRATION}

application.security.private.key.path=${PRIVATE_KEY_PATH}
application.security.public.key.path=${PUBLIC_KEY_PATH}


spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}

